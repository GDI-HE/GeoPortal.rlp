name: Gemini Code Review
on: 
  pull_request:
    types: [labeled] # Tells GitHub to only run this when a label is added

jobs:
  review:
    if: github.event.label.name == 'gemini-review' # Ensures it only runs for our specific label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: gemini-3.6-flash
